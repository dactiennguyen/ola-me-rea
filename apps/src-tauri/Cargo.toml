[package]
name = "ola-desktop"
# Crate version only; the app/bundle version comes from ../package.json (tauri.conf.json).
version = "0.1.0"
description = "Ola Desktop: manage Ola accounts, messages, explore and chat rooms"
edition = "2021"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "ola_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
